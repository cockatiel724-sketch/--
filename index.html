<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ArrowRush v5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- スタート画面 -->

<div id="startScreen">

  <div id="logo">

    <div class="logo-line top">

      <span class="text">ARROW</span>

      <div class="arrow-row">
        <div class="mini-arrow"></div>
        <div class="mini-arrow"></div>
        <div class="mini-arrow"></div>
      </div>
    </div>

    <div class="logo-line bottom">
      <span class="text">RUSH</span>
      <div class="arrow-row">
        <div class="mini-arrow"></div>
        <div class="mini-arrow"></div>
        <div class="mini-arrow"></div>
      </div>
    </div>
  </div>

  <div id="description">
    矢印の向きにスワイプ！
    <br><br>
    30コンボでFEVER！
    <br>
    FEVER中はスコア2倍！
  </div>

  <button id="startBtn">
    START
  </button>
</div>
  
<div id="ui">
  Score: <span id="score">0</span><br>
  Combo: <span id="combo">0</span><br>
  Energy: <span id="energy">30</span>
</div>
<div id="arrow"></div>

<!-- GAME OVER -->
<div id="gameOver">
  <div id="gameOverTitle">GAME OVER</div>
  <div id="finalScoreLabel">SCORE </div>
  <div id="finalScore">0</div>
  <button id="retryBtn">RETRY</button>
</div>

<script src="systems/input.js"></script>
<script src="systems/arrow.js"></script>
<script src="systems/trail.js"></script>
<script src="main.js"></script>
  
</body>
</html>
